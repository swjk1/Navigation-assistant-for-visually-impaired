plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.indoorperception'
version = '1.0.0'

android {
  namespace "expo.modules.indoorperception"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  sourceSets {
    main {
      assets.srcDirs += ['src/main/assets']
    }
  }
}

dependencies {
  // This module owns the app's single ARCore session and feeds the navigation engine from it.
  // ARCore requires exclusive camera access, so there can only be one owner.
  implementation project(':navigation-native')
  implementation 'com.google.ar:core:1.56.0'

  // The fine-tuned indoor model is an end-to-end ONNX export, so ONNX Runtime replaces TFLite.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.19.2'
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}

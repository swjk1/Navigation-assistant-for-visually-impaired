name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: my-app

jobs:
  # The JavaScript/TypeScript side: lint, both type-check passes, and the offline test suite.
  # Nothing here touches the network, a Gemini key or a device, so it is safe to run on every
  # push. The things that DO need those live in scripts/ and are run by hand.
  app:
    name: App (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the input, and a CI run that
      # quietly resolves a different tree is not testing what anyone will ship.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  # The platform-independent navigation core. It builds WITHOUT the Android SDK or ARCore on
  # purpose - that is what keeps the boundary honest, since an accidental
  # `import com.google.ar.core.*` in the core fails this job rather than sitting unnoticed until
  # someone tries to port it.
  core:
    name: Navigation core (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        working-directory: my-app/navigation-core
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-core-test-report
          path: my-app/navigation-core/build/reports/tests/test
